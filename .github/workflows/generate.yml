# 수집 → Claude 작성 → 카드 → 텔레그램 미리보기 (설계서 4.7)
# 자동 실행은 tick.yml이 맡는다(10분마다 깨어나 게시 90~30분 전이면 같은 단계를 실행).
# 이 파일은 직접 실행(Run workflow / Claude의 수동 실행)용으로 남겨 둔다.
# 2026-11-06까지는 여기에 시각별 예약(cron)이 있었지만 GitHub가 4~11시간 늦게 돌려 tick 방식으로 바꿨다.
name: generate

on:
  workflow_dispatch:
    inputs:
      account:
        description: "계정 (accounts/ 파일 이름)"
        default: today_news
      slot:
        description: "게시 시각 HH:MM (비우면 설정의 창, 기본 30~90분 뒤 시각을 자동 선택)"
        required: false
      mock_llm:
        description: "Claude 대신 샘플 문구 사용 (비용 0, 시험용)"
        type: boolean
        default: false

permissions:
  contents: write   # media 브랜치에 상태 파일 저장

concurrency:
  group: newsbot-media   # 모든 워크플로가 같은 그룹: media 브랜치를 동시에 고치지 않게
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: 패키지 설치
        run: pip install -r requirements.txt
      - name: 카드용 브라우저·이모지 폰트 설치
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-color-emoji
          python -m playwright install --with-deps --only-shell chromium
      - name: git 사용자 설정
        run: |
          git config --global user.name "newsbot"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 미리보기 만들기
        env:
          ACCOUNT: ${{ inputs.account || 'today_news' }}
          SLOT: ${{ inputs.slot }}
          MOCK_LLM: ${{ inputs.mock_llm }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}   # 릴스 v3 배경 영상 검색(없으면 글자 릴스로 대신)
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          args=(generate --account "$ACCOUNT")
          if [ -n "$SLOT" ]; then args+=(--slot "$SLOT"); fi
          if [ "$MOCK_LLM" = "true" ]; then args+=(--mock-llm); fi
          python -m newsbot "${args[@]}"
