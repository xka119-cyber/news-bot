account_key: today_news
enabled: true
brand_name: "오늘의 3분 뉴스"
timezone: Asia/Seoul

secrets:
  ig_user_id: IG_USER_ID
  ig_access_token: IG_ACCESS_TOKEN

slots:
  - "07:30"                       # 2026-11-11 사용자 결정: 하루 4번(07:30·12:00·18:00·21:30) → 출근·퇴근 2번. 원인 진단 기간 동안 양 줄이기
  - "18:00"
generate_window_minutes: [30, 90]  # 게시 90~30분 전 사이에 깨어난 첫 tick이 미리보기를 만든다 (2026-11-06, 전에는 '60분 전' 예약 하나)
posts_per_slot: 1                # 2026-11-05 사용자 결정: 팔로워를 모으는 동안 시각마다 1개(하루 4개). 11-04에는 2개(하루 8개)였음. 성장 후 2로 되돌릴 수 있음

# 2026-11-07 사용자 결정: 같은 뉴스를 카드뉴스 + 릴스로 둘 다 올림(승인은 한 번). 설계서의 2주 A/B(format_plan)는 쓰지 않음
reels:
  enabled: true
  # 2026-11-09 v2: 카드 얹은 15초(v1)는 3초 안에 넘긴 비율 90~99%, 평균 1.5초 시청 → 큰 글씨 장면 약 12초
  # 2026-11-10: v2도 평균 시청 1.1~1.8초(첫 화면 2.2초가 끝나기 전에 넘김) → 첫 화면 1.5초, 줄인 0.7초는 마무리로
  hook_seconds: 1.5               # 첫 화면(질문·숫자). 평균 시청 시간 안에 다음 장면이 나오게
  beat_seconds: 2.4               # 핵심 3줄, 한 화면에 한 줄
  end_seconds: 3.3                # 마무리 한 줄 + 팔로우 권유
  # 2026-11-11 v3: AI 목소리 + 무료 실사 영상(Pixabay) + 큰 자막. 폰 인사이트에서 10명 중 6명이 1초 안에 넘김(글자 화면이 문제).
  # 열쇠(PIXABAY_API_KEY)가 없거나 목소리·영상을 못 구하면 자동으로 아래 v2 설정의 글자 릴스로 대신 만든다.
  style: v3
  voice: ko-KR-SunHiNeural        # 여성. 남성은 ko-KR-InJoonNeural
  voice_rate: "+15%"
  clip_judge: true                # Claude가 후보 영상 썸네일을 보고 고름(릴스 1개 약 $0.002). 태그 규칙만으로는 엉뚱한 영상이 섞였음(11-12)
  music: true                     # 코드로 만든 잔잔한 배경음(저작권 무료). 2026-11-09 사용자 선택. false = 무음
  share_to_feed: false            # 릴스 탭에만. 프로필 격자에 같은 뉴스가 두 번 보이지 않게

collect:
  # 2026-11-04 동작 확인 (요약 있음, 최근 12시간 기사 꾸준함) — 균형형
  rss_feeds:
    - { source: 연합뉴스, section: 경제, url: "https://www.yna.co.kr/rss/economy.xml" }
    - { source: 연합뉴스, section: 산업, url: "https://www.yna.co.kr/rss/industry.xml" }
    - { source: 동아일보, section: 경제, url: "https://rss.donga.com/economy.xml" }
    - { source: 동아일보, section: 과학, url: "https://rss.donga.com/science.xml" }
    - { source: SBS, section: 경제, url: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=02&plink=RSSREADER" }
    - { source: SBS, section: 생활, url: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=08&plink=RSSREADER" }
    - { source: 매일경제, section: 부동산, url: "https://www.mk.co.kr/rss/50300009/" }
    - { source: 전자신문, section: 속보, url: "https://rss.etnews.com/Section901.xml" }
    - { source: ZDNet Korea, section: IT, url: "https://feeds.feedburner.com/zdkorea" }
  lookback_hours: 12
  include_categories: [경제, 생활, IT, 트렌드, 날씨·교통]
  exclude_categories: [정치, 선거, 사건사고, 범죄, 연예가십]
  # 1차 필터(제목·요약에 들어 있으면 제외). 최종 판단은 M2에서 Claude가 한 번 더 한다.
  exclude_keywords:
    # 정치·선거
    [대통령, 대통령실, 국회, 여당, 야당, 민주당, 국민의힘, 정당, 국회의원, 의원들, 선거, 대선, 총선,
     지방선거, 탄핵, 국정감사, 국감, 청문회, 정치권, 여야, 북한, 김정은, 尹, 李,
    # 사건사고·범죄
     사망, 숨져, 숨진, 살인, 폭행, 성범죄, 성폭행, 마약, 참사, 화재, 추락, 실종, 피해자, 구속, 체포,
     기소, 검찰, 경찰 조사, 압수수색, 징역, 재판,
    # 연예 가십
     열애, 결별, 이혼, 불륜, 스캔들]
  # 2026-11-19 실험(내 돈 + 지금 할 일): 제목에 이 낱말이 있으면 후보 30개 앞쪽(최대 20개)에 먼저 넣는다.
  # 근거: 12시간 기사 약 190개 중 30개만 Claude에게 가서, 할 일이 있는 생활 기사가 잘려 나갔음. 되돌리기 = [] 로 비우기
  # 넓은 낱말은 엉뚱한 기사에 걸려서 뺌(11-19 검토): 포인트(%포인트·코스피 50포인트), 신청(영장·파산 신청), 인상/인하(인상적·인하대),
  # 사기(사기 혐의 = 피해자 있는 사건), 금리·대출·날씨(시장 통계·매시간 날씨에 늘 걸림) → 구체적인 말로 바꿈
  priority_keywords:
    [신청 시작, 신청 접수, 접수 시작, 환급, 지원금, 보조금, 수당, 바우처, 쿠폰, 할인, 혜택, 카드 포인트, 포인트 소멸, 마일리지,
     연말정산, 소득공제, 세액공제, 청약, 무주택, 요금 인상, 요금 인하, 가격 인상, 가격 인하, 값 인상, 값 인하, 전기료, 가스비,
     교통비, 통신비, 보험료, 수수료 인하, 대출 금리, 예금 금리, 적금, 월세, 전세, 과태료, 리콜, 주의보, 피해 예방,
     소멸, 달라진다, 바뀐다, 내년부터, 다음달부터, 이달부터, 오늘부터, 내일부터, 한파, 폭설]
  items_per_post: 1               # 2026-11-04 사용자 결정: 1게시물 = 뉴스 1개

write:
  model: claude-haiku-5-5
  max_output_tokens: 4000         # Haiku 5.5는 생각(thinking)도 출력 토큰에 포함되어 설계서의 2000보다 넉넉히
  tone: "친근한 존댓말, 짧고 쉬운 문장"
  monthly_budget_usd: 2.0
  # 2026-11-19 실험: 내 돈·생활 + 지금 할 일 1개인 뉴스를 먼저 고름(prompts/focus_money_action.md). 되돌리기 = general
  # 판정 기준은 docs/GROWTH_LOG.md '11-19 개선 검토'에 실험 전에 고정함
  focus: money_action

design:
  card_size: [1080, 1350]
  reel_size: [1080, 1920]
  colors: { bg: "#FFFFFF", primary: "#1F2A44", accent: "#FFC83D", text: "#111111" }
  font: Pretendard
  template: sticker               # 2026-11-04 사용자 선택 (시안 B, 소개 게시물과 같은 손글씨·메모지 느낌)

caption:
  # 고정 태그. Claude가 뽑은 기사 주제어 2~3개 뒤에 앞에서부터 채워 최대 5개 (2026-11-05)
  hashtags: ["#3분뉴스", "#오늘의뉴스", "#경제뉴스", "#뉴스요약", "#출근길뉴스"]
  ai_disclosure: true
  schedule_note: ""               # 수동 승인이라 시간이 달라질 수 있어 비워 둠 (2026-11-04 사용자 결정)

approval:
  required: true
  # 2026-11-18 사용자 요청: 자동 게시. 미리보기는 그대로 오고, ⏭ 건너뛰기를 누르지 않으면 게시 시각에 올라간다
  on_timeout: publish
