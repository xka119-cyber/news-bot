account_key: today_news
enabled: true
brand_name: "오늘의 3분 뉴스"
timezone: Asia/Seoul

secrets:
  ig_user_id: IG_USER_ID
  ig_access_token: IG_ACCESS_TOKEN

slots:
  - "07:30"
  - "12:00"
  - "18:00"
  - "21:30"
generate_lead_minutes: 60

format_plan:
  test_start_date: null
  week1: { "07:30": reel, "12:00": carousel, "18:00": reel, "21:30": carousel }
  week2: { "07:30": carousel, "12:00": reel, "18:00": carousel, "21:30": reel }
reels_enabled: false

collect:
  # 2026-11-04 동작 확인 (요약 있음, 최근 12시간 기사 꾸준함) — 균형형
  rss_feeds:
    - { source: 연합뉴스, section: 경제, url: "https://www.yna.co.kr/rss/economy.xml" }
    - { source: 연합뉴스, section: 산업, url: "https://www.yna.co.kr/rss/industry.xml" }
    - { source: 동아일보, section: 경제, url: "https://rss.donga.com/economy.xml" }
    - { source: 동아일보, section: 과학, url: "https://rss.donga.com/science.xml" }
    - { source: SBS, section: 경제, url: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=02&plink=RSSREADER" }
    - { source: SBS, section: 생활, url: "https://news.sbs.co.kr/news/SectionRssFeed.do?sectionId=08&plink=RSSREADER" }
    - { source: 매일경제, section: 부동산, url: "https://www.mk.co.kr/rss/50300009/" }
    - { source: 전자신문, section: 속보, url: "https://rss.etnews.com/Section901.xml" }
    - { source: ZDNet Korea, section: IT, url: "https://feeds.feedburner.com/zdkorea" }
  lookback_hours: 12
  include_categories: [경제, 생활, IT, 트렌드, 날씨·교통]
  exclude_categories: [정치, 선거, 사건사고, 범죄, 연예가십]
  # 1차 필터(제목·요약에 들어 있으면 제외). 최종 판단은 M2에서 Claude가 한 번 더 한다.
  exclude_keywords:
    # 정치·선거
    [대통령, 대통령실, 국회, 여당, 야당, 민주당, 국민의힘, 정당, 국회의원, 의원들, 선거, 대선, 총선,
     지방선거, 탄핵, 국정감사, 국감, 청문회, 정치권, 여야, 북한, 김정은, 尹, 李,
    # 사건사고·범죄
     사망, 숨져, 숨진, 살인, 폭행, 성범죄, 성폭행, 마약, 참사, 화재, 추락, 실종, 피해자, 구속, 체포,
     기소, 검찰, 경찰 조사, 압수수색, 징역, 재판,
    # 연예 가십
     열애, 결별, 이혼, 불륜, 스캔들]
  items_per_post: 1               # 2026-11-04 사용자 결정: 1게시물 = 뉴스 1개

write:
  model: claude-haiku-5-5
  max_output_tokens: 4000         # Haiku 5.5는 생각(thinking)도 출력 토큰에 포함되어 설계서의 2000보다 넉넉히
  tone: "친근한 존댓말, 짧고 쉬운 문장"
  monthly_budget_usd: 2.0

design:
  card_size: [1080, 1350]
  reel_size: [1080, 1920]
  colors: { bg: "#FFFFFF", primary: "#1F2A44", accent: "#FFC83D", text: "#111111" }
  font: Pretendard
  template: sticker               # 2026-11-04 사용자 선택 (시안 B, 소개 게시물과 같은 손글씨·메모지 느낌)

caption:
  hashtags: ["#오늘의뉴스", "#뉴스요약", "#출근길뉴스", "#경제뉴스", "#3분뉴스"]
  ai_disclosure: true
  schedule_note: ""               # 수동 승인이라 시간이 달라질 수 있어 비워 둠 (2026-11-04 사용자 결정)

approval:
  required: true
  on_timeout: skip
